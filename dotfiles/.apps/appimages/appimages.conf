# AppImages managed by ~/.scripts/update-system (update_appimages)
#
# update-system reads this file from ~/.nix/dotfiles/.apps/appimages/. The copy
# in ~/.apps/appimages/ is a home-manager link kept as a reference only.
#
# Add a new AppImage:
#   1. Find the GitHub repo and open its Releases page. Copy the AppImage
#      asset's filename and replace the version with {TAG} or {VER}:
#        {TAG} = the full release tag       (e.g. v1.0.34)
#        {VER} = the tag without a leading v (e.g. 1.0.34)
#   2. Add a block below. The [section] name becomes the file name in
#      ~/.apps/appimages/ and the .desktop / icon name.
#   3. Run update-system.
#
# Keys:
#   name        Display name in the app launcher                (required)
#   repo        GitHub owner/repo                              (required)
#   asset       Release asset filename, with {TAG}/{VER}        (required unless url is set)
#   url         Full download URL template; overrides asset    (optional, for non-GitHub-standard URLs)
#   latest      URL that redirects to the newest release,      (optional, default:
#               ending in its tag                               github.com/<repo>/releases/latest)
#   categories  freedesktop categories, ;-separated            (optional)
#   env         Space-separated VAR=value pairs set at launch  (optional)
#   desktop     no = don't create a menu entry or icon         (optional, default: yes)
#
# Apps that make their own menu entry (e.g. ArtCraft Launcher): if an app shows
# up twice in your app launcher, set desktop = no and delete the script-made
# ~/.local/share/applications/<section>.desktop and ~/.local/share/icons/<section>.png.
# On a fresh install there's no menu entry until you run the AppImage once from
# ~/.apps/appimages/.
#
# Apps that update themselves are fine: if the version inside the AppImage
# already matches the latest release, update-system won't download it again.
#
# Non-GitHub apps (e.g. GitLab) need both url and latest; repo is then only
# used as a label. GitLab's latest URL looks like:
#   https://<host>/api/v4/projects/<id>/releases/permalink/latest

[navibeat]
name       = NaviBeat
repo       = nenadjokic/navibeat-linux
asset      = NaviBeat-linux-x86_64.AppImage
categories = AudioVideo;Audio;Player;
env        = _JAVA_AWT_WM_NONREPARENTING=1

[artcraft-launcher]
name       = ArtCraft Launcher
repo       = storytold/craft-launcher
asset      = artcraft-launcher-{VER}-linux-x86_64.AppImage
categories = Graphics;Office;Utility;
desktop    = no

[futo-notes]
name       = FUTO Notes
repo       = futo-notes/futo-notes
latest     = https://gitlab.futo.org/api/v4/projects/488/releases/permalink/latest
url        = https://gitlab.futo.org/api/v4/projects/488/packages/generic/futo-notes/{TAG}/FUTO-Notes-{VER}-x86_64.AppImage
categories = Office;Utility;

[iptvnator]
name       = IPTVnator
repo       = 4gray/iptvnator
asset      = iptvnator-{VER}-linux-x86_64.AppImage
categories = AudioVideo;Video;Player;TV;
